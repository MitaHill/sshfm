name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Python + Docker (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build local image
        run: docker build -t sshfm:python-local .

      - name: Test SQLite virtual filesystem
        run: docker run --rm sshfm:python-local python -m unittest discover -s tests -v

      - name: Verify multi-user operations over SSH and container persistence
        run: python3 tests/docker_ssh.py sshfm:python-local
