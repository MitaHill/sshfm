name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake perl xz-utils binutils file

      - name: Build bundled dependencies and sshfm
        env:
          SSHFM_WORK: ${{ runner.temp }}/sshfm-build
        run: bash build.sh --jobs "$(nproc)"

      - name: Verify executable
        run: |
          test -x out/sshfm
          file out/sshfm
          readelf -h out/sshfm | grep -q 'Advanced Micro Devices X86-64'
          if readelf -l out/sshfm | grep -q INTERP; then
            echo 'Expected a statically linked executable' >&2
            exit 1
          fi
          ./out/sshfm --help

      - name: Package executable
        run: tar -czf out/sshfm-linux-x86_64.tar.gz -C out sshfm

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sshfm-linux-x86_64
          path: out/sshfm-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sshfm-build-logs
          path: ${{ runner.temp }}/sshfm-build/*.log
          if-no-files-found: ignore
          retention-days: 7
